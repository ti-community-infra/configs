apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization  
configMapGenerator:
  - name: prow-config
    options:
      disableNameSuffixHash: true
    files:
      - config.yaml
  - name: prow-labels-config
    options:
      disableNameSuffixHash: true
    files:
      - labels.yaml
  - name: prow-labels
    options:
      disableNameSuffixHash: true
    files:
      - labels.yaml
  - name: prow-plugins
    options:
      disableNameSuffixHash: true
    files:
      - plugins.yaml
  - name: prow-plugin
    options:
      disableNameSuffixHash: true
    files:
      - plugins.yaml
  - name: prow-external-plugins-config
    options:
      disableNameSuffixHash: true
    files:
      - external_plugins_config.yaml
  - name: prow-external-plugins
    options:
      disableNameSuffixHash: true
    files:
      - external_plugins_config.yaml
  - name: prow-protected-changes-config
    options:
      disableNameSuffixHash: true
    files:
      - protected_changes_config.yaml
  - name: prow-openai
    options:
      disableNameSuffixHash: true
    files:
      - openai/tasks.yaml
